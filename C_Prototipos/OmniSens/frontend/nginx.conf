server {
    listen 80;
    server_name omnisens-iot.ddns.net localhost;
    
    # Redirigir tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name omnisens-iot.ddns.net;

    ssl_certificate /etc/letsencrypt/live/omnisens-iot.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnisens-iot.ddns.net/privkey.pem;

    # Opciones SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Servir archivos estáticos del frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para las peticiones de API hacia el backend
    location /api/ {
        proxy_pass http://aqi_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Cabeceras para conservar la IP real del cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
